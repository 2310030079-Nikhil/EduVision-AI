[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eduvision-ai"
version = "1.0.0"
description = "EduVision AI - Multimodal RAG Learning Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.38.0",
    "groq>=0.11.0",
    "pypdf>=5.0.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "reportlab>=4.2.0",
    "duckduckgo-search>=6.0.0",
    "pytest>=8.0.0",
]
